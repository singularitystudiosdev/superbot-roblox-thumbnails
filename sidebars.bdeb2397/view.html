<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the creative's own markup, resolved from the spot's root so its pages and images load as they do there; the
     sidebar is mounted inside its app by main.bdeb2397.js, and the Automations tab (automations-view.03378ba4.js) over
     the chat and the live view when the sidebar's Automations row is clicked, or at load with ?tab=automations -->
<base href="../">
<title>ouroboro: keep improving my Roblox thumbnails, with the chat sidebar</title>
<link rel="icon" href="data:,">
<!-- three.js for the sidebar's live logo (mark.901bc0c7.js), as the logos page maps it -->
<script type="importmap">{ "imports": { "three": "./logos.4bc2a2d5/vendor/three.module.js" } }</script>
<link rel="stylesheet" href="style.af4c3c6b.css">
<link rel="stylesheet" href="sidebars.bdeb2397/spot.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/tokens.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/sidebar.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/variants.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/groups.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/automations.03378ba4.css">
<link rel="stylesheet" href="sidebars.bdeb2397/tint.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/chatview.bdeb2397.css">
<link rel="stylesheet" href="sidebars.bdeb2397/chat-ui.854d0793.css">
<link rel="stylesheet" href="sidebars.bdeb2397/settings.854d0793.css">
<link rel="stylesheet" href="sidebars.bdeb2397/publish.6c0fd59e.css">
<link rel="stylesheet" href="sidebars.bdeb2397/latest.bfdfd5c2.css">
<style>
  /* inside the app the sidebar takes the app's full height on its left edge */
  .app > .sb { position: absolute; left: 0; top: 0; bottom: 0; height: auto; }
</style>
</head>
<body>
<main>
<div id="stage">
  <div class="app">
    <section class="ch" aria-label="Chat">
      <button class="ch-open" type="button" aria-label="Show your computer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
      <div class="ch-feed"><div class="ch-in"></div></div>
      <!-- the live chat's composer is the creative's picture of one (its run types into it), inert until it is wired
           (live.e61b4e86.js); every other chat's is a copy of it that works too (chat-ui.854d0793.js) -->
      <div class="composer" aria-hidden="true" inert>
        <div class="rc">
          <div class="rc-ph"><span class="rc-hint">How can ouroboro help you today?</span><span class="rc-typed"></span><i class="rc-caret"></i></div>
          <div class="rc-row">
            <button class="rc-plus" type="button" aria-label="Add files and more" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
            <button class="rc-effort" type="button" aria-label="Effort: High" aria-haspopup="dialog" aria-expanded="false"><sb-tier class="rc-effort-ic" tier="high" aria-hidden="true"><img src="sidebars.bdeb2397/fx/tier-high.8e7c682e.png" alt="" width="96" height="96" draggable="false"></sb-tier><span class="rc-effort-t">High</span><svg class="rc-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <button class="rc-bell" type="button" aria-label="Notifications for this chat" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
            <button class="rc-mic" type="button" aria-label="Dictate" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button>
            <button class="rc-send" type="button" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
          </div>
        </div>
      </div>
    </section>
    <section class="cc" aria-label="Your computer">
      <div class="cc-stack">
        <div class="cc-top">
          <button class="cc-top-btn" type="button" aria-label="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg></button>
          <button class="cc-top-btn cc-close" type="button" aria-label="Close sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="cc-frame">
          <div class="cc-view"></div>
          <span class="cc-stop"><i></i>Stop</span>
        </div>
        <div class="ac">
          <div class="ac-list"><div class="ac-in"></div><p class="ac-empty">Ouroboro's steps show up here as it works.</p></div>
        </div>
      </div>
    </section>
  </div>
  <div id="dip"></div>
</div>
<div class="hint" hidden>space pause, R restart, arrows step</div>
</main>
<script type="module" src="sidebars.bdeb2397/main.bdeb2397.js"></script>
<!-- the Automations tab, hung on the sidebar main.bdeb2397.js has just built -->
<script type="module" src="sidebars.bdeb2397/automations-view.03378ba4.js"></script>
<!-- every other control working: the composer and its bell, New chat, Settings, search, collapse, Share and Stop -->
<script type="module" src="sidebars.bdeb2397/chat-ui.854d0793.js"></script>
</body>
</html>
