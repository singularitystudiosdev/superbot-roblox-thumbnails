<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot sidebar variant beside the creative</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.bdeb2397.css">
<link rel="stylesheet" href="sidebar.bdeb2397.css">
<link rel="stylesheet" href="variants.bdeb2397.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--surface); }
  /* the app at its own 1200x675 with the sidebar on its left, scaled as one to fit the window */
  #frame { position: absolute; left: 50%; top: 50%; display: flex; width: calc(var(--side-w) + var(--app-w)); height: var(--app-h); transform-origin: 50% 50%; }
  #app { flex: none; display: block; width: var(--app-w); height: var(--app-h); border: 0; }
</style>
</head>
<body>
<div id="frame"><div id="side"></div><iframe id="app" title="The superbot creative"></iframe></div>
<script type="module">
  // ?v=<variant number> picks the variant (the left and right arrow keys step through them), ?t= freezes the creative at
  // that second, ?state=loading|empty shows the list's other states
  import { sidebarHTML, variantIndex, VARIANTS } from './shell.bdeb2397.js';
  const params = new URLSearchParams(location.search);
  const frame = document.getElementById('frame'), side = document.getElementById('side'), app = document.getElementById('app');
  const state = params.get('state') || 'ready';
  let current = variantIndex(params.get('v') ?? 1);

  function show(index) {
    current = index;
    const variant = VARIANTS[index];
    side.innerHTML = sidebarHTML(index, { state });
    document.title = `Variant ${variant.id}: ${variant.name}`;
    params.set('v', String(variant.id));
    history.replaceState(null, '', `?${params}`);
  }
  function fit() {
    const k = Math.min(innerWidth / frame.offsetWidth, innerHeight / frame.offsetHeight);
    frame.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  app.src = params.has('t') ? `../index.html?t=${encodeURIComponent(params.get('t'))}` : '../index.html';
  addEventListener('resize', fit);
  addEventListener('keydown', (e) => {
    const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (step) show((current + step + VARIANTS.length) % VARIANTS.length);
  });
  show(current);
  fit();
  window.__sidebarReady = true;
</script>
</body>
</html>
